# Android only. killApp is the system killing the app in the background (issue #6): the
# process ends, the task and its saved state stay, so relaunching (without stopping the app)
# brings back the screens that were open. stopApp is what clears them.
appId: ${BENCH || 'dev.testbuddy.bench'}
name: killApp keeps the saved state (Android)
---
- runFlow: {file: scenarios/steps/open.yaml, env: {SCENARIO: navigation}}
- tapOn: {id: nav_push}
- tapOn: {id: nav_push}
- assertVisible: "Depth 2"
# In the background, as in the issue's report
- pressKey: Home
- killApp
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible: "Depth 2"
    timeout: 15000
- back
- assertVisible: "Depth 1"
# Still in the foreground: killApp sends it to the background first
- killApp
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible: "Depth 1"
    timeout: 15000
