appId: ${BENCH || 'dev.testbuddy.bench'}
name: Read content in the embedded system browser
tags: [scenarios]
---
- runFlow: {file: ../../scenarios/steps/open.yaml, env: {SCENARIO: native}}
- tapOn: {id: tk_browser}
- tapOn: {id: tk_open_browser}
# The app's local server is up before the Safari view opens, but the view's first page load
# runs in system web processes that can take longer than the default 17 s lookup on a fresh,
# busy simulator (issue #92: the page appeared 18.6 s after the tap). Wait for the load.
- extendedWaitUntil:
    visible: "Account login"
    timeout: 45000
- assertVisible: "Sign in to account"
- assertVisible: "Reset password"
# Two taps on one button of the Safari view's page, each its own step: the second may not be
# taken with the first as a double tap (the page would zoom and lose a click, as a WKWebView's
# did: issues #212, #264). The page is read from the SafariViewService window.
- tapOn: "Sign in to account"
- tapOn: "Sign in to account"
- assertVisible: "Sign-in taps: 2"
