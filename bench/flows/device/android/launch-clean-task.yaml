# Android only (issue #281). The runtime permission dialog is another app's activity (the
# permission controller's) in the bench app's task: the app asks with requestPermissions, which
# starts it without NEW_TASK, like Google Play services' dialogs, the share chooser or the
# document picker. Stopping the app ends its process and its own activities, not that dialog,
# which stays in the app's task and covered every later launch. A launch after a stop
# (stopApp, the default, clearState, or a stopApp step before) starts the app in a clean task.
# Permissions stay unset, so each tap on "Ask camera" brings the dialog back.
appId: ${BENCH || 'dev.testbuddy.bench'}
name: launchApp after a stop starts in a clean task (Android)
---
- launchApp:
    clearState: true
    permissions: {all: unset}
- assertVisible: {id: scenario_permissions} # third row, on screen without scrolling
- tapOn: {id: scenario_permissions}
- tapOn: {id: perm_camera}
- assertVisible: "While using the app|Allow|Only this time"
# launchApp stops the app by default
- launchApp:
    permissions: {all: unset}
- assertVisible: {id: scenarios_title}
- assertNotVisible: "While using the app|Allow|Only this time"

# stopApp, then a launch that does not stop the app: nothing of the app's own is left to resume
- assertVisible: {id: scenario_permissions} # third row, on screen without scrolling
- tapOn: {id: scenario_permissions}
- tapOn: {id: perm_camera}
- assertVisible: "While using the app|Allow|Only this time"
- stopApp
- launchApp:
    stopApp: false
    permissions: {all: unset}
- assertVisible: {id: scenarios_title}
- assertNotVisible: "While using the app|Allow|Only this time"

# clearState: Android removes the app's task with its data, and with the dialog in it the
# removal ends after the clear returned, killing the app's processes; the start waits for it
- assertVisible: {id: scenario_permissions} # third row, on screen without scrolling
- tapOn: {id: scenario_permissions}
- tapOn: {id: perm_camera}
- assertVisible: "While using the app|Allow|Only this time"
- launchApp:
    clearState: true
    permissions: {all: unset}
- assertVisible: {id: scenarios_title}
- assertNotVisible: "While using the app|Allow|Only this time"
