appId: ${BENCH || 'dev.testbuddy.bench'}
name: A screen kept mounted under the one pushed on top is neither seen nor a cover
tags: [scenarios]
---
# Issue #320: the previous screen of a stack stays mounted, listed after the pushed screen but
# drawn under it. It must not be seen, and its button, at the place of the pushed screen's,
# must not be taken for a layer over it. Once the pushed screen is gone, it is seen again.
- runFlow: {file: ../../scenarios/steps/open.yaml, env: {SCENARIO: native}}
- tapOn: {id: tk_stack}
- assertVisible: {id: tk_stack_top_title, text: Pushed screen}
- assertNotVisible: Placeholder line
- assertNotVisible: {id: tk_stack_prev_open}
- tapOn: {id: tk_stack_pop}
- assertVisible: Placeholder line
- tapOn: {id: tk_stack_prev_open}
- assertVisible: {id: tk_stack_status, text: Opened 2 times}
- assertNotVisible: Placeholder line
