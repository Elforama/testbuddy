appId: ${BENCH || 'dev.testbuddy.bench'}
name: Scenario overlays
tags: [scenarios]
---
- runFlow: {file: steps/open.yaml, env: {SCENARIO: overlays}}
- assertVisible: "Nothing yet"
# A modal dialog: its buttons, then the screen under it again.
- tapOn: {id: open_dialog}
- assertVisible: "Delete item?"
- tapOn: "Delete"
- assertVisible: {id: overlay_result, text: "Deleted"}
- tapOn: {id: open_dialog}
- tapOn: "Cancel"
- assertVisible: {id: overlay_result, text: "Cancelled"}
# A bottom sheet over the Under button.
- tapOn: {id: open_sheet}
- tapOn: {id: sheet_action}
# iOS hides the screen behind a sheet: close it before reading the result.
- runFlow:
    when: {visible: {id: sheet_close}}
    commands:
      - tapOn: {id: sheet_close}
- assertVisible: {id: overlay_result, text: "Sheet action"}
# A see-through veil that swallows taps for 1.5 s: the tap waits for it.
# On iOS the spinner occupies only the center while its enclosing view covers the button.
- tapOn: {id: show_veil}
- tapOn: {id: under_button}
- assertVisible: "Under taps: 1"
# A tooltip that a tap only dismisses.
- tapOn: {id: show_tooltip}
- assertVisible: "Tip: long press for more"
# A touch outside the tooltip dismisses it without activating the underlying screen.
- tapOn: {point: "90%,45%"}
- assertNotVisible: "Tip: long press for more"
- assertVisible: "Under taps: 1"
- tapOn: {id: under_button}
- assertVisible: "Under taps: 2"
# A snackbar for 3 s with an action.
- tapOn: {id: show_snackbar}
- tapOn: {id: snackbar_undo}
- assertVisible: {id: overlay_result, text: "Undone"}
# A sheet presented over a full-screen cover.
- tapOn: {id: open_cover}
- assertVisible: {id: cover_title}
- tapOn: {id: cover_sheet}
- assertVisible: {id: cover_sheet_title}
- tapOn: {id: cover_sheet_done}
- assertVisible: "Done on cover"
- tapOn: {id: cover_close}
- assertVisible: {id: under_button}
# Web only: JavaScript dialogs (issue #91). tb answers each as it opens; answerDialogs chooses
# the answer and assertDialog checks one opened. They open in a cross-origin iframe (its own
# process and CDP session in Chrome), and a beforeunload "Leave site?" opens on the page.
- runFlow:
    when: {true: "${maestro.platform == 'web'}"}
    commands:
      - tapOn: {id: open_js_dialogs}
      - assertVisible: {id: js_result, text: "No dialog yet"}
      - tapOn: {id: js_alert}
      - assertDialog: {text: "Hello from the other origin", type: alert}
      - assertVisible: {id: js_result, text: "Alert closed"}
      - tapOn: {id: js_confirm}
      - assertDialog: {text: "Delete it?", type: confirm}
      - assertVisible: {id: js_result, text: "Confirmed"}
      - tapOn: {id: js_prompt}
      - assertDialog: {text: "Your name?", type: prompt}
      - assertVisible: {id: js_result, text: "Hello Ada"}
      - answerDialogs: CANCEL
      - tapOn: {id: js_confirm}
      - assertVisible: {id: js_result, text: "Kept"}
      - tapOn: {id: js_prompt}
      - assertVisible: {id: js_result, text: "No name"}
      - answerDialogs: {text: "Grace"}
      - tapOn: {id: js_prompt}
      - assertDialog: {text: "Your name?", type: prompt}
      - assertVisible: {id: js_result, text: "Hello Grace"}
      # Leaving a guarded page: tb leaves it, whatever answerDialogs chose.
      - answerDialogs: CANCEL
      - tapOn: {id: js_guard}
      - assertVisible: {id: js_guard_status, text: "Leaving: guarded"}
      - openLink: "${BENCH}?left=1"
      - assertDialog: {type: beforeunload}
      - assertVisible: {id: scenarios_title}
