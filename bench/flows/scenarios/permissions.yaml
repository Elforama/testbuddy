appId: ${BENCH || 'dev.testbuddy.bench'}
name: Scenario permissions
tags: [scenarios]
---
# Fresh permissions: everything unset, so each button raises the system prompt.
- launchApp:
    clearState: true
    permissions: {all: unset}
- assertVisible: {id: scenarios_title}
- scrollUntilVisible: {element: {id: scenario_permissions}}
- tapOn: {id: scenario_permissions}
- assertVisible: "Camera: not asked"
# The system dialogs differ in their button labels and contacts grant sequence.
- runFlow:
    when: {platform: Android}
    commands:
      - tapOn: {id: perm_camera}
      - tapOn: "While using the app|Allow|Only this time"
      - assertVisible: "Camera: granted"
      - tapOn: {id: perm_location}
      - tapOn: "Don.t allow|Deny"
      - assertVisible: "Location: denied"
      - tapOn: {id: perm_contacts}
      - tapOn: "Allow"
      - assertVisible: "Contacts: granted"
      - tapOn: {id: perm_notifications}
      - tapOn: "Allow"
      - assertVisible: "Notifications: granted"
- runFlow:
    when: {platform: iOS}
    commands:
      - tapOn: {id: perm_camera}
      - tapOn: "Allow|OK"
      - assertVisible: "Camera: granted"
      - tapOn: {id: perm_location}
      - tapOn: "Don.t Allow"
      - assertVisible: "Location: denied"
      - tapOn: {id: perm_contacts}
      # iOS 18+: "Continue", then a sheet to share all contacts or pick some.
      - tapOn: "Continue|OK"
      # Issue #238: that sheet can come 7 s or more after "Continue" (on a busy CI runner),
      # later than an optional tap waits. Wait for the sheet, or for the status where there is
      # no sheet (before iOS 18): whichever shows first ends the wait.
      - extendedWaitUntil:
          visible: "Share All .*Contacts|Allow Full Access|Contacts: (granted|limited)"
          timeout: 20000
      - tapOn: {text: "Share All .*Contacts|Allow Full Access", optional: true}
      - assertVisible: "Contacts: (granted|limited)"
      - tapOn: {id: perm_notifications}
      - tapOn: "Allow"
      - assertVisible: "Notifications: granted"
# An in-app rationale before the system prompt.
- tapOn: {id: perm_rationale}
- assertVisible: "We need your microphone"
- tapOn: {id: rationale_no}
- assertNotVisible: "We need your microphone"
# Statuses read back from the system.
- tapOn: {id: perm_refresh}
# Only the native paths above have accepted and declined system prompts.
- runFlow:
    when: {true: "${tb.platform != 'web'}"}
    commands:
      - scrollUntilVisible: {element: "Camera: granted", direction: UP}
      - assertVisible: "Camera: granted"
      - assertVisible: "Location: denied"
