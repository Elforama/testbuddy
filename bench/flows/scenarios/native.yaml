appId: ${BENCH || 'dev.testbuddy.bench'}
name: Scenario native toolkits
tags: [scenarios]
---
- runFlow: {file: steps/open.yaml, env: {SCENARIO: native}}
# Each target offers different toolkit screens. The mobile WebView uses shared steps.
- runFlow:
    when: {platform: Android}
    commands:
      - runFlow: {file: steps/toolkit.yaml, env: {TK: tk_views}}
      - runFlow: {file: steps/toolkit.yaml, env: {TK: tk_compose}}
      - runFlow: steps/toolkit-webview.yaml
- runFlow:
    when: {platform: iOS}
    commands:
      - runFlow: {file: steps/toolkit.yaml, env: {TK: tk_swiftui}}
      - runFlow: {file: steps/toolkit.yaml, env: {TK: tk_uikit}}
      - runFlow: steps/toolkit-webview.yaml
- runFlow:
    when: {true: "${maestro.platform == 'web'}"}
    commands:
      - runFlow: {file: steps/toolkit.yaml, env: {TK: tk_dom}}
      - runFlow: {file: steps/toolkit.yaml, env: {TK: tk_shadow}}
      - runFlow: {file: steps/toolkit.yaml, env: {TK: tk_iframe}}
