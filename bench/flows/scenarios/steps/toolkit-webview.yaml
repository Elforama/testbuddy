# The shared WebView mini screen. The Android DOM inspection flow checks IDs separately.
appId: ${BENCH || 'dev.testbuddy.bench'}
---
- tapOn: {id: tk_webview}
- assertVisible: "^(WK)?WebView$"
# Three taps on one button, each its own step: none may be taken with the one before as a
# double tap (on iOS WKWebView's double-tap zoom took two and lost a click on a CI runner:
# issue #212; tb spaces such taps in CI mode).
- tapOn: "Tap"
- tapOn: "Tap"
- tapOn: "Tap"
- assertVisible: "Taps: 3"
- tapOn: "^Switch$"
- assertVisible: "^On$"
# The field has only a placeholder. Android's WebView leaves that out of its accessibility
# node (no text, hint or description: issue #169), so no runner reading Android
# accessibility (tb without `androidWebViewHierarchy: devtools`) can find it by "Type here"
# there; its DOM id is the node's resource id. WKWebView gives no ids, only the placeholder.
- runFlow:
    when: {platform: Android}
    commands:
      - tapOn: {id: tk_field}
- runFlow:
    when: {platform: iOS}
    commands:
      - tapOn: {text: "Type here"}
- inputText: "hi"
- assertVisible: "Echo: hi"
- hideKeyboard
- scrollUntilVisible: {element: "Toolkit row 30"}
- tapOn: {id: back}
- assertVisible: {id: tk_webview}
