<!doctype html>
<!-- Native toolkits: the mini screen as a local page in an Android WebView. Ids are element ids. -->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebView</title>
<style>
  body { font-family: sans-serif; margin: 0 16px; color: #1b1b1f; background: #fff; }
  h1 { font-size: 20px; margin: 8px 0 12px; }
  .row { display: flex; align-items: center; gap: 12px; margin: 8px 0; }
  button { font-size: 16px; padding: 10px 20px; border: 0; border-radius: 20px; background: #3d5afe; color: #fff; }
  input[type=text] { font-size: 16px; padding: 10px; width: 100%; box-sizing: border-box; }
  ul { list-style: none; padding: 0; margin: 8px 0; }
  li { height: 56px; line-height: 56px; font-size: 18px; border-bottom: 1px solid #e3e5ec; }
</style>
</head>
<body>
  <h1 id="tk_title">WebView</h1>
  <div class="row"><button id="tk_tap">Tap</button><span id="tk_count">Taps: 0</span></div>
  <div class="row">
    <input id="tk_switch" type="checkbox" role="switch" aria-label="Switch">
    <span id="tk_switch_status">Off</span>
  </div>
  <input id="tk_field" type="text" placeholder="Type here" autocomplete="off">
  <p id="tk_echo">Echo: </p>
  <p id="webview-visual-marker" aria-hidden="true">Visual marker</p>
  <form id="webview-form-marker" aria-hidden="true">
    <input type="hidden" name="id"><span>Form marker</span>
  </form>
  <ul id="tk_list"></ul>
<script>
  let taps = 0;
  const $ = (id) => document.getElementById(id);
  $('tk_tap').onclick = () => { taps++; $('tk_count').textContent = 'Taps: ' + taps; };
  $('tk_switch').onchange = (e) => { $('tk_switch_status').textContent = e.target.checked ? 'On' : 'Off'; };
  $('tk_field').oninput = (e) => { $('tk_echo').textContent = 'Echo: ' + e.target.value; };
  let deep = document.createElement('div');
  $('webview-form-marker').after(deep);
  deep.setAttribute('aria-hidden', 'true');
  for (let level = 0; level < 24; level++) {
    deep = deep.appendChild(document.createElement('div'));
  }
  deep.id = 'webview-deep-marker';
  deep.textContent = 'Deep marker';
  for (let n = 1; n <= 30; n++) {
    const li = document.createElement('li');
    li.id = 'tk_row_' + n;
    li.textContent = 'Toolkit row ' + n;
    $('tk_list').appendChild(li);
  }
</script>
</body>
</html>
