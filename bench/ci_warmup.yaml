# The mobile CI warm-up starts the agent and app before the timed flows. Verify
# touch input too, since the tree can be readable before the device accepts gestures.
appId: dev.testbuddy.bench
name: CI warm-up
---
- launchApp:
    clearState: true
- assertVisible: {id: scenarios_title}
# Scroll to the last row, open it, and require the destination before timing the suite.
- scrollUntilVisible: {element: {id: scenario_transitions}, centerElement: true}
- tapOn: {id: scenario_transitions}
- assertVisible: {id: scenario_title}
- launchApp:
    clearState: true
- assertVisible: {id: scenarios_title}
