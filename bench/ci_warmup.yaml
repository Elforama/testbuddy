# The iOS e2e job's warm-up (.github/workflows/ci.yml), run once before the timed flows and not
# counted: it starts tb's agent, launches the bench app (its first launch on a fresh simulator
# is the slowest) and has XCTest open its session with the app, so the flows that count do
# not pay for the simulator still settling after its boot. Drive the touch channel too:
# a readable tree can precede the virtual digitizer accepting its first gesture.
appId: dev.testbuddy.bench
name: CI warm-up
---
- launchApp:
    clearState: true
- assertVisible: {id: scenarios_title}
# Scroll to the last row, open it, and require the destination before timing the suite.
- scrollUntilVisible: {element: {id: scenario_transitions}, centerElement: true}
- tapOn: {id: scenario_transitions}
- assertVisible: {id: scenario_title}
- launchApp:
    clearState: true
- assertVisible: {id: scenarios_title}
