name: Release

# A version tag publishes a stable release. The release:preview label requests a
# prerelease for the exact PR head. A PR that changes this file runs the build and
# smoke tests for review.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/release.yml"]
  pull_request_target:
    branches: [main]
    types: [labeled]

permissions:
  contents: read

jobs:
  build:
    name: Build
    # The preview workflow comes from main. Only accept same-repository PRs and
    # keep the jobs that run PR code read-only, with no secrets or saved caches.
    if: >-
      github.event_name != 'pull_request_target' ||
      (github.event.label.name == 'release:preview' &&
       github.event.pull_request.head.repo.id == github.event.repository.id)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact-id: ${{ steps.dist.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: ${{ github.event_name != 'pull_request_target' }}
      - name: Check the tag matches tb's version
        id: version
        run: |
          code=$(sed -n 's/^const version = "\(.*\)"$/\1/p' cmd/tb/main.go)
          if [ -z "$code" ] || [[ "$code" == *$'\n'* ]]; then
            echo "expected one version in cmd/tb/main.go"; exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "${GITHUB_REF_NAME#v}" != "$code" ]; then
            echo "tag $GITHUB_REF_NAME does not match cmd/tb/main.go version $code"; exit 1
          fi
          echo "version=$code" >> "$GITHUB_OUTPUT"
      # Pure Go (no cgo), so every target cross-compiles here. The device agents are the
      # ones committed under internal/driver/*/assets, as with `go install`.
      # Archive names carry no version, so .../releases/latest/download/tb_<os>_<arch>.<ext>
      # always fetches the newest release.
      - name: Build and package
        run: |
          package="$RUNNER_TEMP/package"
          dist="$RUNNER_TEMP/dist"
          mkdir -p "$dist"
          for target in darwin/arm64 darwin/amd64 windows/amd64 windows/arm64 linux/amd64 linux/arm64; do
            os=${target%/*}; arch=${target#*/}
            name="tb_${os}_${arch}"
            exe=tb; [ "$os" = windows ] && exe=tb.exe
            mkdir -p "$package/$name"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w" -o "$package/$name/$exe" ./cmd/tb
            cp README.md LICENSE "$package/$name/"
            if [ "$os" = windows ]; then
              (cd "$package" && zip -qr "$dist/$name.zip" "$name")
            else
              tar -C "$package" -czf "$dist/$name.tar.gz" "$name"
            fi
          done
          (cd "$dist" && sha256sum * > checksums.txt)
          ls -l "$dist"
      - uses: actions/upload-artifact@v4
        id: dist
        with:
          name: dist-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error

  # Smoke-test archives on native runners before publishing.
  smoke:
    name: Smoke test (${{ matrix.target }})
    needs: build
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-latest, target: darwin_arm64, ext: tar.gz, exe: tb, web: true }
          - { runner: windows-latest, target: windows_amd64, ext: zip, exe: tb.exe, web: true }
          - { runner: ubuntu-latest, target: linux_amd64, ext: tar.gz, exe: tb }
          - { runner: ubuntu-24.04-arm, target: linux_arm64, ext: tar.gz, exe: tb }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/dist
      - name: Run tb --version, --help and check
        shell: bash
        env:
          NAME: tb_${{ matrix.target }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          dist="$RUNNER_TEMP/dist"
          (cd "$dist" && sha256sum -c --ignore-missing checksums.txt)
          mkdir -p "$RUNNER_TEMP/tb"
          if [ "${{ matrix.ext }}" = zip ]; then
            unzip -q "$dist/$NAME.zip" -d "$RUNNER_TEMP/tb"
          else
            tar -xzf "$dist/$NAME.tar.gz" -C "$RUNNER_TEMP/tb"
          fi
          tb="$RUNNER_TEMP/tb/$NAME/${{ matrix.exe }}"
          out=$("$tb" --version | tr -d '\r')
          echo "$out"
          [ "$out" = "tb $VERSION" ]
          "$tb" --help > /dev/null
          "$tb" check bench/flows/journey-web.yaml
          echo "TB=$tb" >> "$GITHUB_ENV"
      # The released binary runs the Buddy Bench web journey in headless Chrome, which
      # the CI checks only do on Linux.
      - uses: actions/setup-go@v5
        if: matrix.web
        with:
          go-version-file: go.mod
          cache: ${{ github.event_name != 'pull_request_target' }}
      - name: Web journey with the released binary
        if: matrix.web
        shell: bash
        run: |
          bench="$RUNNER_TEMP/bench-web${{ matrix.target == 'windows_amd64' && '.exe' || '' }}"
          go build -o "$bench" ./bench/web
          mkdir -p build/e2e
          "$bench" > build/e2e/bench-web.log 2>&1 &
          curl -fsS --retry 30 --retry-connrefused --retry-delay 1 -o /dev/null http://127.0.0.1:7360/
          "$TB" test bench/flows/journey-web.yaml --headless --debug-output build/e2e/web
      - name: Debug files
        if: failure() && matrix.web
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.target }}-${{ github.run_attempt }}
          path: build/e2e/
          if-no-files-found: ignore
      # The device lock is the one piece with its own Windows code (LockFileEx).
      - name: Device lock tests on Windows
        if: matrix.target == 'windows_amd64'
        run: go test ./internal/devlock/

  publish:
    name: Publish
    needs: [build, smoke]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          merge-multiple: true
          path: dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "tb $GITHUB_REF_NAME" --generate-notes --verify-tag

  publish-preview:
    name: Publish PR preview
    needs: [build, smoke]
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-preview-${{ github.event.number }}-${{ github.event.pull_request.head.sha }}
      cancel-in-progress: false
    steps:
      # Treat the tested artifact as data. This job never checks out or runs PR code.
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          merge-multiple: true
          path: dist
      - name: Publish the prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          tag="pr-$PR_NUMBER-$HEAD_SHA"
          notes="Preview of pull request #$PR_NUMBER at commit \`$HEAD_SHA\`."
          assets=(dist/tb_{darwin,linux}_{arm64,amd64}.tar.gz dist/tb_windows_{arm64,amd64}.zip dist/checksums.txt)
          for asset in "${assets[@]}"; do
            if [[ ! -f "$asset" || -L "$asset" || ! -s "$asset" ]]; then
              echo "Missing or invalid release asset: $asset"
              exit 1
            fi
          done

          release=''
          if release=$(gh release view "$tag" --json author,body,isDraft,isPrerelease,url 2>"$RUNNER_TEMP/release-error"); then
            if ! jq -e --arg notes "$notes" '
              .author.login == "github-actions[bot]" and .body == $notes and .isPrerelease
            ' <<< "$release" > /dev/null; then
              echo "Existing release $tag does not match this preview"
              exit 1
            fi
          elif ! grep -qx 'release not found' "$RUNNER_TEMP/release-error"; then
            cat "$RUNNER_TEMP/release-error" >&2
            exit 1
          fi

          ref="repos/$GH_REPO/git/ref/tags/$tag"
          if ! target=$(gh api "$ref" --jq '.object | .type + ":" + .sha' 2>"$RUNNER_TEMP/tag-error"); then
            if [[ -n "$release" ]] || ! grep -q '(HTTP 404)' "$RUNNER_TEMP/tag-error"; then
              cat "$RUNNER_TEMP/tag-error" >&2
              exit 1
            fi
            target=$(gh api "repos/$GH_REPO/git/refs" -f ref="refs/tags/$tag" -f sha="$HEAD_SHA" \
              --jq '.object | .type + ":" + .sha')
          fi
          if [[ "$target" != "commit:$HEAD_SHA" ]]; then
            echo "Tag $tag points to $target, expected commit:$HEAD_SHA"
            exit 1
          fi

          if [[ -z "$release" ]]; then
            gh release create "$tag" --draft --prerelease --latest=false --verify-tag \
              --target "$HEAD_SHA" --title "tb preview PR #$PR_NUMBER (${HEAD_SHA:0:12})" --notes "$notes"
          elif [[ $(jq -r .isDraft <<< "$release") == false ]]; then
            echo "Already published: $(jq -r .url <<< "$release")"
            exit 0
          fi
          # A failed upload leaves a draft. Retry the entire asset set before publishing.
          gh release upload "$tag" "${assets[@]}" --clobber
          gh release edit "$tag" --draft=false --latest=false
