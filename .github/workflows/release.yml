name: Release

# Pushing a version tag (v0.3.0) builds tb for macOS, Windows and Linux, checks each binary
# on its own system, and publishes a GitHub release with the archives and a checksums file.
# The tag must match the version in cmd/tb/main.go. A pull request that changes this file
# runs the same build and checks, without publishing.
#
# Or, with no tag to push: Actions > Release > Run workflow, on main. That run releases main
# as it is, tagged v<the version in cmd/tb/main.go> (the tag must not exist yet; the release
# creates it on the commit built). Only the repository's owner may: GitHub lets only people
# with write access start a run, and the authorize job stops any run its owner did not start
# (a re-run included) and any run not on main.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authorize:
    name: Authorize
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Only the owner, only on main
        env:
          ACTOR: ${{ github.actor }}
          TRIGGERING: ${{ github.triggering_actor }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ "$ACTOR" != "$OWNER" ] || [ "$TRIGGERING" != "$OWNER" ]; then
            echo "only $OWNER may publish a release (started by $ACTOR, run by $TRIGGERING)"; exit 1
          fi
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "a release is published from main, not $GITHUB_REF"; exit 1
          fi

  build:
    name: Build
    needs: authorize
    # the authorize job runs only for a manual run; a tag or a pull request skips it
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check the tag matches tb's version
        id: version
        run: |
          code=$(sed -n 's/^const version = "\(.*\)"$/\1/p' cmd/tb/main.go)
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "${GITHUB_REF_NAME#v}" != "$code" ]; then
            echo "tag $GITHUB_REF_NAME does not match cmd/tb/main.go version $code"; exit 1
          fi
          # A manual run releases v$code: it must not be out already (bump the version first).
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && git ls-remote --exit-code --tags origin "refs/tags/v$code" > /dev/null; then
            echo "v$code is already tagged: bump the version in cmd/tb/main.go (and plugin.json) first"; exit 1
          fi
          echo "version=$code" >> "$GITHUB_OUTPUT"
      # Pure Go (no cgo), so every target cross-compiles here. The device agents are the
      # ones committed under internal/driver/*/assets, as with `go install`.
      # Archive names carry no version, so .../releases/latest/download/tb_<os>_<arch>.<ext>
      # always fetches the newest release.
      - name: Build and package
        run: |
          mkdir -p dist
          for target in darwin/arm64 darwin/amd64 windows/amd64 windows/arm64 linux/amd64 linux/arm64; do
            os=${target%/*}; arch=${target#*/}
            name="tb_${os}_${arch}"
            exe=tb; [ "$os" = windows ] && exe=tb.exe
            mkdir -p "build/$name"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w" -o "build/$name/$exe" ./cmd/tb
            cp README.md LICENSE "build/$name/"
            if [ "$os" = windows ]; then
              (cd build && zip -qr "../dist/$name.zip" "$name")
            else
              tar -C build -czf "dist/$name.tar.gz" "$name"
            fi
          done
          (cd dist && sha256sum * > checksums.txt)
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # Each binary must start on a machine of its own kind before anything is published.
  smoke:
    name: Smoke test (${{ matrix.target }})
    needs: build
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-latest, target: darwin_arm64, ext: tar.gz, exe: tb, web: true }
          - { runner: windows-latest, target: windows_amd64, ext: zip, exe: tb.exe, web: true }
          - { runner: ubuntu-latest, target: linux_amd64, ext: tar.gz, exe: tb }
          - { runner: ubuntu-24.04-arm, target: linux_arm64, ext: tar.gz, exe: tb }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Run tb --version, --help and check
        shell: bash
        env:
          NAME: tb_${{ matrix.target }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          (cd dist && sha256sum -c --ignore-missing checksums.txt)
          mkdir -p "$RUNNER_TEMP/tb"
          if [ "${{ matrix.ext }}" = zip ]; then
            unzip -q "dist/$NAME.zip" -d "$RUNNER_TEMP/tb"
          else
            tar -xzf "dist/$NAME.tar.gz" -C "$RUNNER_TEMP/tb"
          fi
          tb="$RUNNER_TEMP/tb/$NAME/${{ matrix.exe }}"
          out=$("$tb" --version | tr -d '\r')
          echo "$out"
          [ "$out" = "tb $VERSION" ]
          "$tb" --help > /dev/null
          "$tb" check bench/flows/journey-web.yaml
          echo "TB=$tb" >> "$GITHUB_ENV"
      # The released binary runs the Buddy Bench web journey in headless Chrome, which
      # the CI checks only do on Linux.
      - uses: actions/setup-go@v5
        if: matrix.web
        with:
          go-version-file: go.mod
      - name: Web journey with the released binary
        if: matrix.web
        shell: bash
        run: |
          bench="$RUNNER_TEMP/bench-web${{ matrix.target == 'windows_amd64' && '.exe' || '' }}"
          go build -o "$bench" ./bench/web
          mkdir -p build/e2e
          "$bench" > build/e2e/bench-web.log 2>&1 &
          curl -fsS --retry 30 --retry-connrefused --retry-delay 1 -o /dev/null http://127.0.0.1:7360/
          "$TB" test bench/flows/journey-web.yaml --headless --debug-output build/e2e/web
      - name: Debug files
        if: failure() && matrix.web
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.target }}
          path: build/e2e/
          if-no-files-found: ignore
      # The device lock is the one piece with its own Windows code (LockFileEx).
      - name: Device lock tests on Windows
        if: matrix.target == 'windows_amd64'
        run: go test ./internal/devlock/

  publish:
    name: Publish
    needs: [build, smoke]
    if: ${{ !failure() && !cancelled() && (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            # the tag does not exist yet: the release creates it on the commit built
            gh release create "v$VERSION" dist/* --target "$GITHUB_SHA" \
              --title "tb v$VERSION" --generate-notes
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "tb $GITHUB_REF_NAME" --generate-notes --verify-tag
          fi
