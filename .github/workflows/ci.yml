name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Seven jobs, run side by side, each its own check, and the bench-log job after them: the runner (Go) and each platform's
# on-device agent, which need no device, then one end-to-end job per platform: tb, built from
# this commit, runs the whole Buddy Bench suite on a real emulator, simulator or browser: the
# journey (bench/flows), then every scenario flow (bench/flows/scenarios, bench/SCENARIOS.md).
# A failed step in a flow (an assertVisible that does not hold, a tap that finds nothing)
# makes tb exit non-zero and fails the job. Each e2e job also times every flow and the whole
# suite, compares them with the average of the last 5 logged runs from main (a warning for
# each regression, in the job summary), and the last job commits this run's times to the bench-log branch: one
# file per platform per run (bench/ci_times.py).
jobs:
  runner:
    name: Runner (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l cmd internal bench)
          if [ -n "$unformatted" ]; then echo "not gofmt'd:"; echo "$unformatted"; exit 1; fi
      - run: go vet ./...
      # Release builds cover macOS and Windows too (release.yml): keep them compiling.
      - name: go vet for macOS and Windows
        run: GOOS=darwin go vet ./... && GOOS=windows go vet ./...
      - run: go test -race ./...

  android-agent:
    name: Android agent
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agents/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew testDebugUnitTest
      - name: Build the agent
        run: ./gradlew assembleDebug
      - name: Test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-agent-tests
          path: agents/android/app/build/reports/tests/

  ios-agent:
    name: iOS agent
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        working-directory: agents/ios
        run: swift test
      - name: Build the agent (XCUITest runner and TBProbe)
        run: agents/ios/build.sh
      - name: Build log
        if: failure()
        run: tail -n 80 agents/ios/build/xcodebuild.log || true

  web-agent:
    name: Web agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Ubuntu's AppArmor keeps Chrome's sandbox from starting on GitHub's runners.
      - name: Let Chrome sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: page.js in headless Chrome
        env:
          TB_BROWSER_TESTS: "1"
        run: go test -v -run 'TestPageJS(InChrome|Rules|Actions)$' ./internal/driver/web

  android-e2e:
    name: Android end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      API_LEVEL: "36"
      # A phone-sized screen, like the emulators the flows are written on: the runner's
      # default device is 320x640, where much of each scenario screen is below the fold.
      AVD_PROFILE: pixel_6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: gradle/actions/setup-gradle@v4
      - name: Build tb with this commit's Android agent
        run: |
          (cd agents/android && ./gradlew assembleDebug)
          cp agents/android/app/build/outputs/apk/debug/app-debug.apk internal/driver/android/assets/tb-agent.apk
          go build -o bin/tb ./cmd/tb
      - name: Build Buddy Bench (Android)
        run: echo "BENCH_APK=$(bench/android/build.sh | tail -n 1)" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          cache: true
      - name: Build Buddy Bench Flutter
        working-directory: bench/flutter
        run: |
          flutter build apk --debug --target-platform android-x64
          echo "FLUTTER_BENCH_APK=$PWD/build/app/outputs/flutter-apk/app-debug.apk" >> "$GITHUB_ENV"
      # The emulator shares the runner with the native and Flutter builds. Free
      # the build JVMs before measuring device actions.
      - name: Stop build daemons before starting Android
        run: |
          (cd bench/flutter/android && ./gradlew --stop)
          (cd agents/android && ./gradlew --stop)
      # The emulator needs hardware acceleration.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # The emulator's system image, before the emulator steps (which install it again only if
      # it is missing): its download can come back corrupt ("Error reading Zip content"), with a
      # warning and exit status 0, so a try counts only once the image is there.
      - name: Install the emulator's system image
        run: |
          pkg="system-images;android-${API_LEVEL};google_apis;x86_64"
          img="$ANDROID_HOME/system-images/android-${API_LEVEL}/google_apis/x86_64/system.img"
          for i in 1 2 3; do
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "$pkg" > /dev/null || true
            if [ -f "$img" ]; then echo "installed $pkg"; exit 0; fi
            echo "try $i: $pkg is not installed; trying again"
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --uninstall "$pkg" > /dev/null 2>&1 || true
            sleep 15
          done
          exit 1
      # A booted emulator snapshot, saved once, so later runs skip the cold boot.
      - name: Emulator snapshot cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API_LEVEL }}-google_apis-x86_64-${{ env.AVD_PROFILE }}-swiftshader
      - name: Create the emulator snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          profile: ${{ env.AVD_PROFILE }}
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: echo "snapshot saved"
      # The logged CI times of earlier runs (the bench-log branch; bench/ci_times.py).
      - name: Fetch the CI benchmark log
        run: |
          mkdir -p build/bench-log
          if git fetch --quiet --depth=1 origin bench-log; then git archive FETCH_HEAD | tar -x -C build/bench-log; fi
      - name: Run the bench suite on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          profile: ${{ env.AVD_PROFILE }}
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bench/ci_android.sh
      # Logs this run's times (the bench-log job commits them) and warns about regressions.
      - name: Benchmark against recent logged runs
        if: ${{ !cancelled() }}
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 bench/ci_times.py --platform android --history build/bench-log --out build/e2e/bench-log build/e2e/*.xml
      - name: Test report and debug files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-e2e
          path: build/e2e/
          if-no-files-found: ignore

  ios-e2e:
    name: iOS end-to-end
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Boot first: the simulator starts while the builds below run.
      - name: Boot an iPhone simulator
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          runtimes = json.load(sys.stdin)["devices"]
          def version(key):
              return [int(n) for n in re.findall(r"\d+", key.split("iOS-")[-1])]
          for key in sorted((k for k in runtimes if ".iOS-" in k), key=version, reverse=True):
              phones = [d for d in runtimes[key] if d["isAvailable"] and d["name"].startswith("iPhone")]
              if phones:
                  print(phones[0]["udid"]); break
          ')
          if [ -z "$udid" ]; then echo "no iPhone simulator on this runner"; xcrun simctl list devices available; exit 1; fi
          xcrun simctl list devices | grep "$udid"
          xcrun simctl boot "$udid"
          echo "SIM_UDID=$udid" >> "$GITHUB_ENV"
      - name: Build tb with this commit's iOS agent
        run: |
          agents/ios/build.sh
          go build -o bin/tb ./cmd/tb
      - name: Build Buddy Bench (iOS)
        run: echo "BENCH_APP=$(bench/ios/build.sh | tail -n 1)" >> "$GITHUB_ENV"
      - name: Install Buddy Bench on the simulator
        run: |
          xcrun simctl bootstatus "$SIM_UDID" -b
          xcrun simctl install "$SIM_UDID" "$BENCH_APP"
      # tb finds simulators with `simctl list devices booted` (10 s limit). Right after a boot
      # and install that can be slow on a busy runner, so wait until tb sees this one.
      - name: Wait until tb sees the simulator
        run: |
          for i in $(seq 1 30); do
            start=$(date +%s)
            if bin/tb devices | grep -q "$SIM_UDID"; then break; fi
            echo "tb does not list the simulator yet (check took $(( $(date +%s) - start )) s)"
            sleep 2
          done
          bin/tb devices
          bin/tb devices | grep -q "$SIM_UDID"
      # The logged CI times of earlier runs (the bench-log branch; bench/ci_times.py).
      - name: Fetch the CI benchmark log
        run: |
          mkdir -p build/bench-log
          if git fetch --quiet --depth=1 origin bench-log; then git archive FETCH_HEAD | tar -x -C build/bench-log; fi
      # The simulator's log while the flows run: the agent (its "tb:" lines) and testmanagerd,
      # which answers its screen reads, in full; the bench app's errors. In the e2e artifact.
      - name: Record the simulator's log
        run: |
          mkdir -p build/e2e
          nohup xcrun simctl spawn "$SIM_UDID" log stream --style compact --level default \
            --predicate 'process BEGINSWITH "TBAgent" OR process == "testmanagerd" OR (process == "BuddyBench" AND (messageType == error OR messageType == fault))' \
            > build/e2e/ios-simulator.log 2>&1 &
          echo $! > build/ios-log-stream.pid
      # Uncounted: the simulator keeps busy for a while after its boot (screen reads took up to
      # 60 s, the app was reported not running after a launch), and the first launch and the
      # first read of the app are the slowest. Verify a real touch before measuring.
      - name: Warm up the simulator and verify input
        timeout-minutes: 10
        run: |
          start=$(date +%s)
          bin/tb test bench/ci_warmup.yaml -p ios --device "$SIM_UDID" --keep-agents
          echo "warm-up took $(( $(date +%s) - start )) s"
      - name: Run the bench journey on the simulator
        run: bin/tb test bench/flows/journey.yaml -p ios --device "$SIM_UDID" --keep-agents --format junit --output build/e2e/ios.xml --debug-output build/e2e/ios
      # Runs even when the journey failed, so one run reports every failing flow.
      - name: Run the scenario flows on the simulator
        if: ${{ !cancelled() }}
        run: >-
          bin/tb test bench/flows/scenarios bench/flows/scripting.yaml bench/flows/device/ios/embedded-browser.yaml
          bench/flows/device/accessibility-values.yaml bench/flows/device/controls-gestures.yaml bench/flows/device/navigation-deep-link.yaml
          -p ios --device "$SIM_UDID" --format junit --output build/e2e/ios-scenarios.xml --debug-output build/e2e/ios-scenarios
      # The agent's own log: tb starts it with xcodebuild and keeps its output beside the agent.
      - name: Collect the agent's and the simulator's logs
        if: always()
        run: |
          kill "$(cat build/ios-log-stream.pid 2>/dev/null)" 2>/dev/null || true
          mkdir -p build/e2e
          cp ~/Library/Caches/testbuddy/ios-agent-*/runner-*.log build/e2e/ 2>/dev/null || echo "no agent log"
          gzip -f build/e2e/ios-simulator.log || true
          ls -la build/e2e/*.log* || true
      # Logs this run's times (the bench-log job commits them) and warns about regressions.
      - name: Benchmark against recent logged runs
        if: ${{ !cancelled() }}
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 bench/ci_times.py --platform ios --history build/bench-log --out build/e2e/bench-log build/e2e/*.xml
      - name: Build logs
        if: failure()
        run: |
          tail -n 80 agents/ios/build/xcodebuild.log || true
          tail -n 80 bench/ios/build/xcodebuild.log || true
      - name: Test report and debug files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-e2e
          path: build/e2e/
          if-no-files-found: ignore

  web-e2e:
    name: Web end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Ubuntu's AppArmor keeps Chrome's sandbox from starting on GitHub's runners.
      - name: Let Chrome sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Build tb
        run: go build -o bin/tb ./cmd/tb
      - name: Start Buddy Bench (web)
        run: |
          go build -o bin/bench-web ./bench/web
          mkdir -p build/e2e
          nohup bin/bench-web > build/e2e/bench-web.log 2>&1 &
          curl -fsS --retry 30 --retry-connrefused --retry-delay 1 -o /dev/null http://127.0.0.1:7360/
      # The logged CI times of earlier runs (the bench-log branch; bench/ci_times.py).
      - name: Fetch the CI benchmark log
        run: |
          mkdir -p build/bench-log
          if git fetch --quiet --depth=1 origin bench-log; then git archive FETCH_HEAD | tar -x -C build/bench-log; fi
      - name: Run the bench journey in headless Chrome
        run: bin/tb test bench/flows/journey-web.yaml --headless --format junit --output build/e2e/web.xml --debug-output build/e2e/web
      # Runs even when the journey failed, so one run reports every failing flow.
      - name: Run the scenario flows in headless Chrome
        if: ${{ !cancelled() }}
        run: >-
          bin/tb test bench/flows/scenarios bench/flows/scripting.yaml bench/flows/device/navigation-deep-link.yaml
          -e BENCH=http://127.0.0.1:7360/ -e BENCH_NAVIGATION_URL=http://127.0.0.1:7360/#/navigation/level/3
          --headless --format junit --output build/e2e/web-scenarios.xml --debug-output build/e2e/web-scenarios
      # Logs this run's times (the bench-log job commits them) and warns about regressions.
      - name: Benchmark against recent logged runs
        if: ${{ !cancelled() }}
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 bench/ci_times.py --platform web --history build/bench-log --out build/e2e/bench-log build/e2e/*.xml
      - name: Test report and debug files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e
          path: build/e2e/
          if-no-files-found: ignore

  # Commits each e2e job's times to the bench-log branch, a file per platform per run
  # (bench/ci_times.py). main is protected, and the log grows with every run, so it has its
  # own branch. Pull requests from forks cannot push, so they are not logged.
  bench-log:
    name: Benchmark log
    needs: [android-e2e, ios-e2e, web-e2e]
    if: ${{ !cancelled() && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-e2e"
          path: build/artifacts
      - name: Commit the times to the bench-log branch
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          logs=$(find build/artifacts -path '*/bench-log/ci/*.json' | sort)
          if [ -z "$logs" ]; then echo "no times to log"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch --quiet origin bench-log; then
            git worktree add --quiet "$RUNNER_TEMP/log" FETCH_HEAD
          else
            git worktree add --quiet --detach "$RUNNER_TEMP/log"
            git -C "$RUNNER_TEMP/log" checkout --quiet --orphan bench-log
            git -C "$RUNNER_TEMP/log" rm -rfq --ignore-unmatch .
          fi
          for f in $logs; do
            dest="$RUNNER_TEMP/log/${f#*/bench-log/}"
            mkdir -p "$(dirname "$dest")"
            cp "$f" "$dest"
          done
          cd "$RUNNER_TEMP/log"
          git add ci
          git commit --quiet -m "Bench times: ${GITHUB_HEAD_REF:-$GITHUB_REF_NAME} at ${HEAD_SHA::7}, run $GITHUB_RUN_ID" \
            -m "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          # Runs of other branches log at the same time: their files differ, so a rebase applies.
          for i in 1 2 3 4 5; do
            git push --quiet origin HEAD:refs/heads/bench-log && exit 0
            git pull --quiet --rebase origin bench-log
          done
          exit 1
