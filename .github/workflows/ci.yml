name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Seven jobs, run side by side, each its own check: the runner (Go) and each platform's
# on-device agent, which need no device, then one end-to-end job per platform: tb, built from
# this commit, runs the Buddy Bench journey (bench/flows) on a real emulator, simulator or
# browser. A failed step in the flow (an assertVisible that does not hold, a tap that finds
# nothing) makes tb exit non-zero and fails the job.
jobs:
  runner:
    name: Runner (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l cmd internal bench)
          if [ -n "$unformatted" ]; then echo "not gofmt'd:"; echo "$unformatted"; exit 1; fi
      - run: go vet ./...
      - run: go test -race ./...

  android-agent:
    name: Android agent
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agents/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew testDebugUnitTest
      - name: Build the agent
        run: ./gradlew assembleDebug
      - name: Test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-agent-tests
          path: agents/android/app/build/reports/tests/

  ios-agent:
    name: iOS agent
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        working-directory: agents/ios
        run: swift test
      - name: Build the agent (XCUITest runner and TBProbe)
        run: agents/ios/build.sh
      - name: Build log
        if: failure()
        run: tail -n 80 agents/ios/build/xcodebuild.log || true

  web-agent:
    name: Web agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Ubuntu's AppArmor keeps Chrome's sandbox from starting on GitHub's runners.
      - name: Let Chrome sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: page.js in headless Chrome
        env:
          TB_BROWSER_TESTS: "1"
        run: go test -v -run 'TestPageJS(InChrome|Rules|Actions)$' ./internal/driver/web

  android-e2e:
    name: Android end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      API_LEVEL: "36"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: gradle/actions/setup-gradle@v4
      - name: Build tb with this commit's Android agent
        run: |
          (cd agents/android && ./gradlew assembleDebug)
          cp agents/android/app/build/outputs/apk/debug/app-debug.apk internal/driver/android/assets/tb-agent.apk
          go build -o bin/tb ./cmd/tb
      - name: Build Buddy Bench (Android)
        run: echo "BENCH_APK=$(bench/android/build.sh | tail -n 1)" >> "$GITHUB_ENV"
      # The emulator needs hardware acceleration.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # A booted emulator snapshot, saved once, so later runs skip the cold boot.
      - name: Emulator snapshot cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API_LEVEL }}-google_apis-x86_64
      - name: Create the emulator snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: echo "snapshot saved"
      - name: Run the bench journey on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb install -r "$BENCH_APK"
            bin/tb test bench/flows/journey.yaml -p android --format junit --output build/e2e/android.xml --debug-output build/e2e/android
      - name: Test report and debug files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-e2e
          path: build/e2e/
          if-no-files-found: ignore

  ios-e2e:
    name: iOS end-to-end
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Boot first: the simulator starts while the builds below run.
      - name: Boot an iPhone simulator
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          runtimes = json.load(sys.stdin)["devices"]
          def version(key):
              return [int(n) for n in re.findall(r"\d+", key.split("iOS-")[-1])]
          for key in sorted((k for k in runtimes if ".iOS-" in k), key=version, reverse=True):
              phones = [d for d in runtimes[key] if d["isAvailable"] and d["name"].startswith("iPhone")]
              if phones:
                  print(phones[0]["udid"]); break
          ')
          if [ -z "$udid" ]; then echo "no iPhone simulator on this runner"; xcrun simctl list devices available; exit 1; fi
          xcrun simctl list devices | grep "$udid"
          xcrun simctl boot "$udid"
          echo "SIM_UDID=$udid" >> "$GITHUB_ENV"
      - name: Build tb with this commit's iOS agent
        run: |
          agents/ios/build.sh
          go build -o bin/tb ./cmd/tb
      - name: Build Buddy Bench (iOS)
        run: echo "BENCH_APP=$(bench/ios/build.sh | tail -n 1)" >> "$GITHUB_ENV"
      - name: Install Buddy Bench on the simulator
        run: |
          xcrun simctl bootstatus "$SIM_UDID" -b
          xcrun simctl install "$SIM_UDID" "$BENCH_APP"
      - name: Run the bench journey on the simulator
        run: bin/tb test bench/flows/journey.yaml -p ios --device "$SIM_UDID" --format junit --output build/e2e/ios.xml --debug-output build/e2e/ios
      - name: Build logs
        if: failure()
        run: |
          tail -n 80 agents/ios/build/xcodebuild.log || true
          tail -n 80 bench/ios/build/xcodebuild.log || true
      - name: Test report and debug files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-e2e
          path: build/e2e/
          if-no-files-found: ignore

  web-e2e:
    name: Web end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Ubuntu's AppArmor keeps Chrome's sandbox from starting on GitHub's runners.
      - name: Let Chrome sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Build tb
        run: go build -o bin/tb ./cmd/tb
      - name: Start Buddy Bench (web)
        run: |
          go build -o bin/bench-web ./bench/web
          mkdir -p build/e2e
          nohup bin/bench-web > build/e2e/bench-web.log 2>&1 &
          curl -fsS --retry 30 --retry-connrefused --retry-delay 1 -o /dev/null http://127.0.0.1:7360/
      - name: Run the bench journey in headless Chrome
        run: bin/tb test bench/flows/journey-web.yaml --headless --format junit --output build/e2e/web.xml --debug-output build/e2e/web
      - name: Test report and debug files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e
          path: build/e2e/
          if-no-files-found: ignore
